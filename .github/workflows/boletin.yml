name: Boletín semanal
on:
  schedule:
    - cron: '17 13 * * 5' # viernes 08:17 Colombia (UTC-5)
  workflow_dispatch:
  push:
    paths:
      - actualizar.py
      - .github/workflows/boletin.yml
permissions:
  contents: write
concurrency:
  group: boletin
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recoger noticias de NASA
        run: python3 actualizar.py
      - name: Guardar edición
        run: |
          git config user.name 'Cielos boletín'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boletin.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar boletín educativo de NASA'
            git push
          fi
